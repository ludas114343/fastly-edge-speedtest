name: Deploy and Health - Northflank

on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-northflank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Probe Northflank Container Endpoint
        run: |
          python -c "
          import urllib.request
          host = 'nf-node.ruoyemu.asia'
          try:
              req = urllib.request.Request(f'https://{host}/ws', headers={'User-Agent': 'Probe/1.0'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  print(f'[INFO] {host}: HTTP {r.status}')
          except urllib.error.HTTPError as e:
              print(f'[INFO] {host}: HTTP {e.code} (Handshake accessible)')
          except Exception as e:
              print(f'[WARN] {host} probe warning: {e}')
          "

      - name: Run Optimal Selection for Northflank
        run: |
          python select_optimal_nodes.py --token northflank

      - name: Validate Northflank Strict Single-Node Constraint
        run: |
          python -c "
          import yaml, json, sys
          with open('clash_northflank.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          proxies = data.get('proxies', [])
          print(f'[INFO] Northflank contains {len(proxies)} verified proxies.')
          if len(proxies) > 1:
              print(f'[ERROR] Northflank has {len(proxies)} proxies but strictly 1 deployment allowed!')
              sys.exit(1)
          "

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash_northflank.yaml evidence/subscriptions/northflank.json evidence/subscriptions/hysteresis_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(subscription): auto-update northflank subscription [skip ci]" && git pull --rebase origin main && git push origin main)
