name: Edge Published Nodes Recheck

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  published-nodes-recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Recheck Published Nodes Health
        run: |
          python recheck_published.py

      - name: Commit and Push Metrics
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add usage_metrics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): record 4-hour published nodes health check [skip ci]" && git pull --rebase origin main && git push origin main)
