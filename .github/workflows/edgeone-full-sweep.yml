name: Edge Multi-Platform Full Candidate Sweep

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-candidate-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Hard Monthly Budget Check
        id: budget_check
        run: |
          python budget_watchdog.py --check || {
            STATUS=$?
            if [ $STATUS -eq 2 ]; then
              echo "Monthly Actions budget limit approached. Pausing heavy sweep."
              exit 0
            fi
          }

      - name: Generate and Update All Candidate Pools (4000+ Endpoints)
        run: |
          python generate_all_pools.py

      - name: Run Cloud Anycast Multi-Platform Speedtest
        run: |
          python speedtest.py

      - name: Fail-Safe Integrity Verification
        run: |
          python -c "
          import yaml, sys
          files = ['clash.yaml', 'clash_fastly.yaml', 'clash_wasmer.yaml', 'clash_edgetunnel.yaml', 'clash_netlify.yaml', 'clash_edgeone.yaml']
          for f in files:
              try:
                  d = yaml.safe_load(open(f, encoding='utf-8'))
                  count = len(d.get('proxies', []))
                  if count < 30:
                      print(f'[FAIL-SAFE ERROR] {f} has only {count} proxies! Aborting push to protect working nodes.')
                      sys.exit(1)
                  print(f'[FAIL-SAFE PASS] {f}: {count} proxies verified.')
              except Exception as e:
                  print(f'[FAIL-SAFE ERROR] Failed parsing {f}: {e}')
                  sys.exit(1)
          "

      - name: Geo Gate Pre-Publish Hard Verification
        run: |
          python geo_gate_verify.py clash_edgeone.yaml

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash.yaml clash_fastly.yaml clash_wasmer.yaml clash_edgetunnel.yaml clash_netlify.yaml clash_edgeone.yaml fastly_best_nodes.json edgeone_best_nodes.json edgeone_candidates.json fastly_candidates.json wasmer_candidates.json netlify_candidates.json generate_all_pools.py geo_gate_verify.py geo_audit_report.json usage_metrics.json README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily candidate sweep with Geo Gate audit [skip ci]" && git pull --rebase origin main && git push origin main)
