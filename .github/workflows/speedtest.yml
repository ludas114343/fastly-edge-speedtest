name: Edge Anycast Cloud Speedtest

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and Update EdgeOne Candidates Pool
        run: |
          python generate_edgeone_pool.py

      - name: Run Cloud Anycast Speedtest
        run: |
          python speedtest.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash.yaml clash_fastly.yaml clash_wasmer.yaml clash_edgetunnel.yaml clash_netlify.yaml clash_edgeone.yaml fastly_best_nodes.json edgeone_best_nodes.json edgeone_candidates.json README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update cloud-tested anycast nodes and EdgeOne 36-node pool [skip ci]" && git pull --rebase origin main && git push origin main)
