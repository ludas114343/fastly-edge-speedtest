name: Deploy and Health - Wasmer

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-wasmer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Probe Wasmer Edge Gateways
        run: |
          python -c "
          import urllib.request
          hosts = ['w-la.ruoyemu.asia', 'w-fr.ruoyemu.asia', 'w-use.ruoyemu.asia', 'w-usw.ruoyemu.asia']
          for host in hosts:
              try:
                  req = urllib.request.Request(f'https://{host}/', headers={'User-Agent': 'Probe/1.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      print(f'[INFO] {host}: HTTP {r.status}')
              except urllib.error.HTTPError as e:
                  print(f'[INFO] {host}: HTTP {e.code} (Handshake accessible)')
              except Exception as e:
                  print(f'[WARN] {host} probe warning: {e}')
          "

      - name: Run Optimal Selection for Wasmer
        run: |
          python select_optimal_nodes.py --token wasmer

      - name: Validate Wasmer Subscription and Physical Node Bound
        run: |
          python -c "
          import yaml, json, sys
          with open('clash_wasmer.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          proxies = data.get('proxies', [])
          print(f'[INFO] Wasmer contains {len(proxies)} verified proxies.')
          if len(proxies) > 4:
              print(f'[ERROR] Wasmer proxy count {len(proxies)} exceeds physical deployment limit of 4!')
              sys.exit(1)
          "

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash_wasmer.yaml evidence/subscriptions/wasmer.json evidence/subscriptions/hysteresis_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(subscription): auto-update wasmer subscription [skip ci]" && git pull --rebase origin main && git push origin main)
